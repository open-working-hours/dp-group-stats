[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dp-group-stats"
version = "0.1.2"
description = "Differentially private publication pipeline for aggregate group statistics with k-anonymity gating and budget accounting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lukas Jonathan Hondrich", email = "lukas.hondrich@gmail.com" },
]
keywords = [
    "differential-privacy",
    "dp",
    "k-anonymity",
    "privacy",
    "statistics",
    "aggregate",
    "laplace",
    "epsilon",
    "budget",
    "gdpr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dp-group-stats-simulate = "dp_group_stats.simulation:main"

[project.urls]
Homepage = "https://github.com/lukashondrich/dp-group-stats"
Repository = "https://github.com/lukashondrich/dp-group-stats"
Documentation = "https://github.com/lukashondrich/dp-group-stats/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/dp_group_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
